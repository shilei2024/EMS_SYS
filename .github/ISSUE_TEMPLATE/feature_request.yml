name: 💡 功能请求
description: 提出一个新功能建议
title: "[Feature]: <简短描述>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能建议！请填写以下信息。

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰简洁地描述想要的功能
      placeholder: 描述功能...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 相关问题
      description: 这个功能解决了什么问题？
      placeholder: 描述相关的问题...
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 描述使用场景
      placeholder: 描述谁会如何使用这个功能...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 实现建议
      description: 如何实现这个功能（可选）
      placeholder: 描述实现思路...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 这个功能的重要程度
      options:
        - 低 - 有了更好
        - 中 - 有帮助
        - 高 - 需要
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 是否考虑过其他解决方案？
      placeholder: 描述考虑过的其他方案...
    validations:
      required: false
