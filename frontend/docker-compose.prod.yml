version: '3.8'

services:
  # 外部门户
  external-portal:
    build:
      context: ./external-portal
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${API_BASE_URL:-http://localhost:8001}
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_API_BASE=${API_BASE_URL:-http://localhost:8001}
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - model-gateway
      - auth-service

  # 内部管理系统
  internal-admin:
    build:
      context: ./internal-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${API_BASE_URL:-http://localhost:8001}
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network

  # Model Gateway (Python FastAPI)
  model-gateway:
    build:
      context: ../../services/model-gateway
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
    networks:
      - app-network

  # Auth Service (Go Gin)
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    environment:
      - GIN_MODE=release
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin123}
      - POSTGRES_DB=${DB_NAME:-ecs_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../databases/postgres/init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - app-network

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - external-portal
      - internal-admin
      - model-gateway
      - auth-service
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
