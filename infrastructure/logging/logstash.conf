input {
  beats {
    port => 5044
  }

  # TCP 日志输入
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # 解析 JSON 日志
  json {
    source => "message"
    target => "parsed"
  }

  # 添加时间戳
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss" ]
    target => "@timestamp"
  }

  # 提取服务名称
  if [parsed][logger] {
    mutate {
      gsub => [ "logger", "^[a-zA-Z0-9_-]+\\.", "" ]
    }
  }

  # 添加标签
  mutate {
    add_field => { "environment" => "development" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }

  # 调试输出（开发环境）
  stdout {
    codec => rubydebug
  }
}
