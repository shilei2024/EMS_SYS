# Nuxt.js 外部门户 Kubernetes 部署配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-portal
  labels:
    app: external-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: external-portal
  template:
    metadata:
      labels:
        app: external-portal
    spec:
      containers:
        - name: external-portal
          image: external-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NUXT_PUBLIC_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: apiBaseUrl
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/_health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/_health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: external-portal
spec:
  selector:
    app: external-portal
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: external-portal-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: external-portal
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
